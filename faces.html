<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="UTF-8">
  <title>faces</title>

  <!-- p5 library -->
  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/p5.min.js"></script>

    <!-- 🎨 CSS (styling goes here) -->
    <style>

      body {
        margin: 0;
        overflow: hidden;
      }

      /* dots canvas sits behind everything */
      canvas {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  display: block;
  z-index: 0;
}

      /* container for faces */
      .canvas {
        position: relative;
        width: 100vw;
        height: 100vh;
        z-index: 1;
      }

      /* each face */
    .face {
  position: absolute;
  width: 12vw;

  transform: translate(-50%, -50%);
  animation: float 4s ease-in-out infinite;
  transition: transform 0.2s ease;
}

.face:hover {
      animation: none;
  transform: translate(-50%, -54%) scale(1.03);
}

@keyframes float {
  0%   { transform: translate(-50%, -50%); }
  50%  { transform: translate(-50%, -53%); }
  100% { transform: translate(-50%, -50%); }
}

#cursor-label {
  position: fixed;
  pointer-events: none;

  color: white;
  font-family: 'Roboto Mono', monospace;
  font-size: 14px;

  background: rgba(0, 0, 0, 0.379);
  padding: 2px 6px;
  border-radius: 4px;

  opacity: 0;
  transform: translate(-50%, -120%);
  transition: opacity 0.15s ease;

  z-index: 10;
}

.canvas a {
  position: absolute;
  transform: translate(-50%, -50%);
}

      /* hide by default */
.mobile-block {
  display: none;
}

/* mobile override */
/* mobile override */
@media (max-width: 768px) {

  body *:not(.mobile-block):not(.mobile-block *) {
    display: none;
  }

  .mobile-block {
  display: flex;
  min-height: 100vh;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 32px 24px;
  font-family: 'Roboto Mono', monospace;
  color: #1e2643;
  box-sizing: border-box;
}

.mobile-graphic {
  width: min(82vw, 420px);
  height: auto;
  margin: 6px 0 22px 0;
}

.mobile-top,
.mobile-bottom {
  max-width: 340px;
  margin: 0;
  font-size: 15px;
  line-height: 1.5;
}

}

    </style>
  </head>

  <body>

   <!-- MOBILE BLOCK -->

  <p class="mobile-top">This site is currently designed for desktop viewing only.</p>

  <img src="desktoponly.png" class="mobile-graphic" alt="Desktop viewing illustration">

  <p class="mobile-bottom">For the best experience, please visit on a desktop or laptop computer.</p>
</div>

  <!-- DOT CONFIG FIRST -->
<script>
  window.dotConfig = {

</script>

<!-- THEN load sketch -->

    <!--CURSOR LABEL-->
<div id="cursor-label"></div>

<!--CURSOR HOVER INTERACTION LOGIC-->
<script>
const label = document.getElementById("cursor-label");
const faces = document.querySelectorAll(".face");

faces.forEach(face => {
  face.addEventListener("mouseenter", () => {
    label.textContent = face.dataset.label;
    label.style.opacity = 1;
  });

  face.addEventListener("mouseleave", () => {
    label.style.opacity = 0;
  });
});

window.addEventListener("mousemove", (e) => {
  label.style.left = e.clientX + "px";
  label.style.top = e.clientY + "px";
});
</script>

  </body>

</html>
