 <body style="margin:0; perspective: 800px;">

    <!-- STYLING -->

     
    <style>
      /* hide by default */
.mobile-block {
  display: none;
}

/* mobile override */
/* mobile override */
@media (max-width: 1180px) {

  body *:not(.mobile-block):not(.mobile-block *) {
    display: none;
  }

  .mobile-block {
  display: flex;
  min-height: 100vh;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 32px 24px;
  font-family: 'Roboto Mono', monospace;
  color: #1e2643;
  box-sizing: border-box;
}

.mobile-graphic {
  width: min(82vw, 420px);
  height: auto;
  margin: 6px 0 22px 0;
}

.mobile-top,
.mobile-bottom {
  max-width: 340px;
  margin: 0;

}
     
     #face-wrapper {
        position: fixed;
        top: 50%;
        left: 47%;
        transform: translate(-50%, -50%) rotate(17deg);
        width: 600px;
        z-index: 1;
      }

      #face {
        width: 100%;
        transform-style: preserve-3d;
        will-change: transform;
      }

      #shadow {
  position: fixed;
  top: 84%;        /* tweak later */
  left: 50%;

  width: 220px;
  height: 40px;

  background: rgba(31, 29, 46, 0.757);
  filter: blur(12px);
  border-radius: 50%;

  transform: translateX(-50%);
  pointer-events: none;
  z-index: 1;
}

#cursor-label {
  position: fixed;
  top: 0;
  left: 0;

  font-size: 16px;
  font-family: 'Roboto Mono', monospace;
  color: rgb(255, 255, 255);
 
  letter-spacing: 1px;
text-transform: lowercase;

  pointer-events: none;
  opacity: 1;

  transform: translate(-50%, -50%);
  transition: opacity 0.15s ease;

  z-index: 999;
}
    </style>

    <!-- MOVEMENT -->
    <script>
      const face = document.getElementById("face");

      let currentX = 0;
      let currentY = 0;

      let targetX = 0;
      let targetY = 0;

     window.addEventListener("mousemove", (e) => {
  const rect = face.parentElement.getBoundingClientRect();
  const centerX = rect.left + rect.width / 2;
  const centerY = rect.top + rect.height / 2;

  const dx = (e.clientX - centerX) / (window.innerWidth / 2);
  const dy = (e.clientY - centerY) / (window.innerHeight / 2);

  // 👇 normalize to -1 → 1 range, then scale
  targetY = -dx * 35;   // left/right
  targetX = dy * 30;    // up/down
});

//smoothing loop   
      function animate() {
        currentX += (targetX - currentX) * 0.06;
        currentY += (targetY - currentY) * 0.06;
currentX *= 0.98;
currentY *= 0.98;
        

        const maxTilt = 28;

  currentX = Math.max(-maxTilt, Math.min(maxTilt, currentX));
  currentY = Math.max(-maxTilt, Math.min(maxTilt, currentY));

        face.style.transform = `
          rotateX(${currentX}deg)
          rotateY(${currentY}deg)
        `;

        requestAnimationFrame(animate);
      }

      animate();

      const shadow = document.getElementById("shadow");

let shadowX = 0;
let shadowTargetX = 0;
let shadowY = 0;          // 👈 MUST exist
let shadowTargetY = 0;    // 👈 MUST exist

window.addEventListener("mousemove", (e) => {
  const dx = (e.clientX - window.innerWidth / 2) / (window.innerWidth / 2);
shadowTargetX = -dx * 120;

// vertical = based on horizontal distance (not dy)
shadowTargetY = Math.abs(dx) * 40;});

function animateShadow() {
  shadowX += (shadowTargetX - shadowX) * 0.12;

 shadowY += (shadowTargetY - shadowY) * 0.12;

 

shadow.style.transform = `
  translateX(calc(-50% + ${shadowX}px))
  translateY(${shadowY}px)
`;

  requestAnimationFrame(animateShadow);
}

animateShadow();

const label = document.getElementById("cursor-label");
const faceWrapper = document.getElementById("face-wrapper");

// track mouse position
window.addEventListener("mousemove", (e) => {
  label.style.left = e.clientX + "px";
  label.style.top = e.clientY -10 + "px";
});

// show/hide on hover
faceWrapper.addEventListener("mouseenter", () => {
  label.style.opacity = 1;
});

faceWrapper.addEventListener("mouseleave", () => {
  label.style.opacity = 0;
});
    </script>


  </body>
</html>
